sociaţia de Proprietari bloc M5A-ScaraA, 11 Dec 2019","note":"The three cumulative conditions of Art. 6(1)(f): legitimate interest, necessity, balancing.","url":"https://curia.europa.eu/juris/liste.jsf?num=C-708/18&language=en","stages":[3],"triggers":[],"verified":"2026-11-09","check":null},{"id":"c_pnr","kind":"case","cite":"C-817/19 Ligue des droits humains, 21 Jun 2022","note":"Automated risk assessment must use non-discriminatory, specific and reliable pre-determined criteria; self-learning systems that change criteria without human review are excluded in that context; human review of hits.","url":"https://curia.europa.eu/juris/liste.jsf?num=C-817/19&language=en","stages":[4],"triggers":["R1","R12","R3"],"verified":"2026-11-09","check":null},{"id":"c_s2","kind":"case","cite":"C-311/18 Facebook Ireland and Schrems (Schrems II), 16 Jul 2020","note":"SCCs need a case-by-case assessment of the destination country and, if needed, supplementary measures.","url":"https://curia.europa.eu/juris/liste.jsf?num=C-311/18&language=en","stages":[2],"triggers":["R11"],"verified":"2026-11-09","check":null},{"id":"c_srb","kind":"case","cite":"C-413/23 P EDPS v SRB, 4 Sep 2025","note":"Pseudonymised data may not be personal data for a recipient who cannot reasonably re-identify; the controller's own obligations are assessed from its perspective at collection.","url":"https://curia.europa.eu/juris/liste.jsf?num=C-413/23&language=en","stages":[1,2],"triggers":["R5"],"verified":"2026-11-09","check":null},{"id":"c_breyer","kind":"case","cite":"C-582/14 Breyer, 19 Oct 2016","note":"Identifiability depends on means reasonably likely to be used, incl. via third parties.","url":"https://curia.europa.eu/juris/liste.jsf?num=C-582/14&language=en","stages":[1],"triggers":[],"verified":"2026-11-09","check":null},{"id":"c_schufa2","kind":"case","cite":"C-26/22 and C-64/22 SCHUFA Holding (Discharge from remaining debts), 7 Dec 2023","note":"Keeping data longer than the public source keeps it is ly means a DPIA is required.","url":"https://ec.europa.eu/newsroom/article29/items/611236","stages":[1,4],"triggers":["dpia","crit1","crit2","crit3","crit4","crit5","crit6","crit7","crit8","crit9"],"verified":"2026-11-09","check":null},{"id":"wp251","kind":"guidance","cite":"WP29 Guidelines on automated decision-making and profiling, WP251 rev.01 (endorsed by EDPB)","note":"Meaning of 'solely automated', 'similarly significant effects', meaningful human involvement.","url":"https://ec.europa.eu/newsroom/article29/items/612053","stages":[4,5],"triggers":["R4","auto","crit1","crit2","R12"],"verified":"2026-11-09","check":null},{"id":"op28","kind":"guidance","cite":"EDPB Opinion 28/2024 on AI models (17 Dec 2024)","note":"When a model is anonymous; legitimate interest for development and deployment; consequences of unlawful development for later use.","url":"https://edpb.europa.eu/system/files/2024-12/edpb_opinion_202428_ai-models_en.pdf","stages":[1,2,3],"triggers":["R5","R6"],"verified":"2026-11-09","check":null},{"id":"gl1_24","kind":"guidance","cite":"EDPB Guidelines 1/2024 on Art. 6(1)(f)","note":"Three-step legitimate interest test.","url":"https://www.edpb.europa.eu/our-work-tools/documents/public-consultations/2024/guidelines-12024-processing-personal-data-based_en","stages":[3],"triggers":[],"verified":"2026-11-09","check":"Published for consultation; check whether a final version has been adopted."},{"id":"edpb_other","kind":"guidance","cite":"EDPB Guidelines 2/2019 (Art. 6(1)(b)), 05/2020 (consent), Recommendations 01/2020 (supplementary measures), Guidelines 01/2025 (pseudonymisation)","note":"Supporting guidance for legal basis, transfers and pseudonymisation.","url":"https://www.edpb.europa.eu/our-work-tools/general-guidance/guidelines-recommendations-best-practices_en","stages":[2,3],"triggers":["R11"],"verified":"2026-11-09","check":null},{"id":"imy_list","kind":"guidance","cite":"IMY list of processing requiring a DPIA (Art. 35(4))","note":"Swedish nat   <style>
:root{--fjord:#123F3B;--copper:#C8733D;--offwhite:#F4F1EC;--ink:#22302E;--mist:#DCE5E2;--sage:#4F7A75;
--font-brand:"Century Gothic",CenturyGothic,"URW Gothic","URW Gothic L","Didact Gothic",AppleGothic,sans-serif}
html,body,#root,button,input,select,textarea{font-family:var(--font-brand)!important}
body{background:var(--offwhite)}
.bg-slate-50{background-color:var(--offwhite)!important}
.text-slate-900{color:var(--ink)!important}
.bg-slate-800{background-color:var(--fjord)!important}
.h-2.bg-slate-800{background-color:var(--copper)!important}
h1{color:var(--fjord)}
h1::after{content:"";display:block;width:56px;height:3px;background:var(--copper);margin-top:6px}
.dpia-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.dpia-tools button{font-size:12px;padding:4px 10px;border:1px solid var(--fjord);color:var(--fjord);background:#fff;border-radius:4px;cursor:pointer}
.dpia-tools button:hover{background:var(--mist)}
.dpia-note{font-size:11px;color:var(--sage)}
@media print{.no-print{display:none!important}}
</style>
<style>
.ref-panel{border:1px solid var(--mist);border-left:3px solid var(--fjord);background:#fff;border-radius:4px;padding:10px 14px;margin:0 0 16px}
.ref-panel summary{cursor:pointer;font-weight:700;color:var(--fjord);font-size:14px}
.ref-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);margin:12px 0 6px}
.ref-list{list-style:none;padding:0;margin:0}
.ref-item{padding:8px 0;border-top:1px solid var(--mist);font-size:13px}
.ref-kind{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;margin-right:8px;background:var(--mist);color:var(--fjord);vertical-align:1px}
.ref-case{background:#F3E3D6;color:#A85A28}.ref-authority{background:#E6ECEA;color:#4F7A75}
.ref-cite{font-weight:700;color:var(--fjord);text-decoration:underline;text-decoration-color:var(--copper);text-underline-offset:2px}
.ref-note{color:var(--ink);margin-top:2px;line-height:1.4}
.ref-check{color:#A85A28;font-size:12px;margin-top:3px}
.ref-annex .ref-kind{display:none}
.ref-foot{font-size:11px;color:var(--sage);margin-top:10px}
@media print{.ref-annex a{color:inherit;text-decoration:none}.ref-annex a::after{content:" — " attr(href);font-size:9px;color:#4F7A75;word-break:break-all}}
</style>
</head>

    <div id="root"></div>
  </body>
</html>
